name: Publish to npm

# Publishes when a version tag (e.g. v0.2.0) is pushed. The tag must match package.json "version".
# n8n requires verified community nodes to be published from GitHub Actions with npm provenance.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # needed for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
