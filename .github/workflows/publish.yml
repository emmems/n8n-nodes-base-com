name: Publish to npm

# Run manually (Actions → Publish to npm → Run workflow, or `gh workflow run publish.yml -f otp=123456`).
# n8n requires verified community nodes to be published from GitHub Actions with npm provenance.
# The path from start to `npm publish` is kept short so an npm 2FA one-time code is still valid when it arrives;
# tests and lint run in the separate CI workflow.
on:
  workflow_dispatch:
    inputs:
      otp:
        description: npm one-time 2FA code (leave empty when the token or trusted publishing needs none)
        required: false
        type: string

permissions:
  contents: read
  id-token: write # needed for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts ${OTP:+--otp=$OTP}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP: ${{ inputs.otp }}
